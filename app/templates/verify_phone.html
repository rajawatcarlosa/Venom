{% extends 'base.html' %}
{% block title %}Verify Phone - Telegram Broadcaster{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5"><div class="card bg-dark border-secondary"><div class="card-header bg-secondary"><h4 class="card-title mb-0"><i class="fas fa-mobile-alt"></i> Verify Phone Number</h4></div><div class="card-body"><div class="alert alert-info" role="alert"><i class="fas fa-info-circle"></i> <strong>Verification Code Sent</strong><p class="mb-0">Check your Telegram app for a code</p></div><p class="text-center text-muted mb-4">Verifying: <strong>{{ phone }}</strong></p><form id="verifyPhoneForm"><div class="mb-3"><label class="form-label">Verification Code</label><input type="text" id="verificationCode" class="form-control bg-dark text-light border-secondary text-center" placeholder="00000" maxlength="5" inputmode="numeric" required autofocus><small class="text-muted">Enter the 5-digit code from Telegram</small></div><div class="d-grid gap-2"><button type="submit" class="btn btn-success btn-lg"><i class="fas fa-check"></i> Verify</button><a href="{{ url_for('accounts.list_accounts') }}" class="btn btn-outline-secondary"><i class="fas fa-times"></i> Cancel</a></div></form></div></div></div></div>
<script>
document.getElementById('verifyPhoneForm').addEventListener('submit',async function(e){e.preventDefault();const code=document.getElementById('verificationCode').value;if(!code||code.length!==5){alert('Please enter a valid 5-digit code');return}try{const r=await fetch('/accounts/verify-phone',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code})});const d=await r.json();if(d.success){alert('Account verified successfully!');window.location.href=d.redirect_url}else{alert(`Verification failed: ${d.error}`)}}catch(error){alert(`Error: ${error.message}`)}});
document.getElementById('verificationCode').addEventListener('keypress',function(e){if(!/[0-9]/.test(e.key))e.preventDefault()});
</script>
{% endblock %}
